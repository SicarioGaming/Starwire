apply plugin: 'com.android.application'
// Screenshot tests on the JVM (Robolectric): gradlew recordRoborazziNonRootDebug / verifyRoborazziNonRootDebug
apply plugin: 'io.github.takahirom.roborazzi'

// The commit this build comes from, for Settings > About. A copy of the source without its .git
// folder says "unknown". (The git.properties inside the APK belongs to JmDNS, not Starwire.)
def gitCommit = 'unknown'
try {
    gitCommit = providers.exec {
        commandLine 'git', 'rev-parse', '--short=12', 'HEAD'
    }.standardOutput.asText.get().trim()
}
catch (Exception ignored) {
}

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        // Starwire's own version. The code carries on from Moonlight X's 315 so that builds
        // installed during development can be upgraded in place.
        versionName "0.2.1"
        versionCode = 319
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit}\""

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            // Its own ID too, so it can never replace a Moonlight root install
            applicationId "com.starwire.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            // Starwire uses its own ID so it installs beside Moonlight X and Artemide
            applicationId "com.starwire"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
        // Starwire: the warnings already in the code are listed in lint-baseline.xml, and any new
        // warning or error fails gradlew lintNonRootDebug. After fixing some of the listed ones,
        // refresh the list with gradlew updateLintBaselineNonRootDebug.
        baseline = file('lint-baseline.xml')
        warningsAsErrors = true
        // These change with what's been released since, not with the code, so they never fail it
        informational 'NewerVersionAvailable', 'GradleDependency', 'AndroidGradlePluginVersion'
    }

    testOptions {
        unitTests {
            // Plain JVM tests (app/src/test): any call into android.* fails loudly, so they stay pure
            returnDefaultValues = false
            // Robolectric screenshot tests (com.limelight.screenshots) read the merged resources
            includeAndroidResources = true
            all {
                // For the tests that check the code against README.md, build files and resources
                systemProperty 'repo.root', rootProject.projectDir.absolutePath
                // The docs, release notes and Windows receiver files those tests read are inputs
                // too, so editing one runs them again instead of leaving the task UP-TO-DATE.
                // Only the files that exist are listed.
                inputs.files(
                        rootProject.files('README.md', 'CHANGELOG.md', 'CONTRIBUTING.md', 'SECURITY.md',
                                'AGENTS.md').filter { it.isFile() },
                        rootProject.fileTree('docs'),
                        rootProject.fileTree('windows') { include '*.md', '*.ps1', '*.cs', 'tests/vectors/**' },
                        rootProject.fileTree('.github/release-notes'))
                        .withPropertyName('repoDocs')
                        .withPathSensitivity(PathSensitivity.RELATIVE)
                // Robolectric's SDK 36 sandbox reaches into FileDescriptor internals on JDK 17+
                jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
                // Half-size screenshots: a quarter of the repo space, still clear enough to review
                systemProperty 'roborazzi.record.resizeScale', '0.5'
            }
        }
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    packaging {
        // libadrenotools loads its hook libraries from nativeLibraryDir, so the .so files must
        // be real files on disk rather than loaded straight from the APK. PyroWave's prebuilt
        // is packaged the same way and still loads by soname.
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Release signing (Starwire): the key's details come from keystore.properties in the
    // project folder (never committed) or from environment variables. Without either, release
    // builds come out unsigned, and Android won't install them.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }

    signingConfigs {
        release {
            def store = signingValue('storeFile', 'STARWIRE_KEYSTORE')
            if (store) {
                storeFile rootProject.file(store)
                storePassword signingValue('storePassword', 'STARWIRE_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'STARWIRE_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'STARWIRE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Starwire (Debug)"
            resValue "string", "app_label_root", "Starwire (Root Debug)"
        }
        release {
            // To whomever is releasing/using an APK in release mode with
            // Moonlight's official application ID, please stop. I see every
            // single one of your crashes in my Play Console and it makes
            // Moonlight's reliability look worse and makes it more difficult
            // to distinguish real crashes from your crashy VR app. Seriously,
            // 44 of the *same* native crash in 72 hours and a few each of
            // several other crashes.
            //
            // This is technically not your fault. I would have hoped Google
            // would validate the signature of the APK before attributing
            // the crash to it. I asked their Play Store support about this
            // and they said they don't and don't have plans to, so that sucks.
            //
            // In any case, it's bad form to release an APK using someone
            // else's application ID. There is no legitimate reason, that
            // anyone would need to comment out the following line, except me
            // when I release an official signed Moonlight build. If you feel
            // like doing so would solve something, I can tell you it will not.
            // You can't upgrade an app while retaining data without having the
            // same signature as the official version. Nor can you post it on
            // the Play Store, since that application ID is already taken.
            // Reputable APK hosting websites similarly validate the signature
            // is consistent with the Play Store and won't allow an APK that
            // isn't signed the same as the original.
            //
            // I wish any and all people using Moonlight as the basis of other
            // cool projects the best of luck with their efforts. All I ask
            // is to please change the applicationId before you publish.
            //
            // TL;DR: Leave the following line alone!
            //
            // Starwire: honoured by giving the nonRoot flavor its own
            // applicationId (com.starwire), so no suffix is needed here.
            resValue "string", "app_label", "Starwire"
            resValue "string", "app_label_root", "Starwire (Root)"

            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files. Its licence is in
            // assets/licenses with the others, shown in Settings > About.
            excludes += '/META-INF/*.md'
        }
    }

    // Prebuilt PyroWave decoder library (see src/main/jni/pyrowave/build_libpyrowave.sh)
    // and libadrenotools custom driver loader (see src/main/jni/adrenotools/build_libadrenotools.sh)
    sourceSets {
        main {
            jniLibs.srcDirs += 'src/main/jni/pyrowave/lib'
            jniLibs.srcDirs += 'src/main/jni/adrenotools/lib'
        }
        // The encrypted microphone's shared vectors, so the device's own crypto is checked too
        // (SecureMicDeviceTest)
        androidTest {
            resources.srcDirs += 'src/test/resources'
            java.srcDirs += 'src/sharedTest/java'
        }
        // Device test tools whose own tests run on the JVM (StuckTestWatchdog, which
        // device-test.sh runs every device test under)
        test {
            java.srcDirs += 'src/sharedTest/java'
        }
    }
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    // Reaches Android's hidden Bluetooth HID calls for the DualSense's trigger effects
    // (Experimental, off by default). Its SHA-256 is checked: gradle/verification-metadata.xml
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // JVM tests (Starwire), no device needed: gradlew testNonRootDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
    // android.jar only has stubs of these, so the JVM tests get the real ones
    testImplementation 'org.json:json:20250517'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    // Screenshot tests: Robolectric runs the real framework (only for tests that ask for it),
    // Roborazzi saves and compares the pictures
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.77.0'

    // On-device tests (Starwire): .github/tools/device-test.sh, which installs over the app with
    // adb install -r and never uninstalls (connectedAndroidTest may, and the pairing would go too)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    // The smoke tests drive the app the way a person would (com.limelight.smoke)
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

// Golden images live beside the tests, so a change to them shows up in review
roborazzi {
    outputDir = file('src/test/screenshots')
}
